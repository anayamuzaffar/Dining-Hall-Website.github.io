<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wildcat Eats — Northwestern Dining</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>

  <!-- Firebase SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, set, push, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    const firebaseConfig = {
      apiKey:            "AIzaSyBKFA-10CvVYWWgtq4R-XD7JWxNk5WKj8U",
      authDomain:        "dining-hall-website.firebaseapp.com",
      databaseURL:       "https://dining-hall-website-default-rtdb.firebaseio.com",
      projectId:         "dining-hall-website",
      storageBucket:     "dining-hall-website.firebasestorage.app",
      messagingSenderId: "1095964988120",
      appId:             "1:1095964988120:web:434bc961324410f8dbbdad",
      measurementId:     "G-RL5FYQHH41"
    };

    const app = initializeApp(firebaseConfig);
    const db  = getDatabase(app);

    window.__fbDb      = db;
    window.__fbRef     = ref;
    window.__fbSet     = set;
    window.__fbPush    = push;
    window.__fbOnValue = onValue;
  </script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #FAFAF7; font-family: Georgia, serif; }
    .ff-serif { font-family: Georgia, serif; }
    .ff-sans  { font-family: system-ui, sans-serif; }
    .btn { cursor: pointer; border: none; font-family: system-ui, sans-serif; font-size: 14px; font-weight: 600; padding: 9px 18px; border-radius: 8px; transition: all .15s; }
    .btn:hover { filter: brightness(.93); }
    .btn:active { transform: scale(.97); }
    .btn-primary { background: #2C2C2A; color: #FAFAF7; }
    .btn-ghost { background: transparent; border: 1.5px solid #D3D1C7; color: #444441; }
    .btn-ghost:hover { background: #F1EFE8; }
    .btn-ghost-inv { background: transparent; border: 1px solid #5F5E5A; color: #FAFAF7; font-family: system-ui, sans-serif; font-size: 13px; font-weight: 600; padding: 6px 12px; border-radius: 7px; cursor: pointer; transition: all .15s; }
    .btn-ghost-inv:hover { background: rgba(255,255,255,.08); }
    .card { background: #fff; border: 0.5px solid #D3D1C7; border-radius: 12px; }
    .pill { display: inline-block; font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 20px; letter-spacing: .04em; text-transform: uppercase; }
    .pts-badge { display: flex; align-items: center; background: #3C3C3A; border-radius: 40px; padding: 7px 14px; font-size: 14px; font-weight: 600; color: #FAFAF7; }
    .fade-in { animation: fi .25s ease; }
    @keyframes fi { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }
    .hall-card:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,.09); }
    .hall-card { transition: all .2s; }
    .tab-btn { background: none; border: none; cursor: pointer; font-family: system-ui, sans-serif; font-size: 13px; font-weight: 600; padding: 9px 14px; border-bottom: 2px solid transparent; transition: all .15s; color: #888; }
    .tab-btn.active { border-bottom-color: currentColor; }
    .modal-overlay { position: fixed; inset: 0; background: rgba(40,40,38,.55); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 20px; }
    .modal-box { background: #FAFAF7; border-radius: 14px; padding: 24px; width: 100%; max-width: 460px; max-height: 88vh; overflow-y: auto; }
    .toast { position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%); padding: 11px 22px; border-radius: 40px; font-family: system-ui, sans-serif; font-size: 13px; font-weight: 600; z-index: 200; animation: fi .2s ease; white-space: nowrap; }
    .toast.success { background: #2C2C2A; color: #FAFAF7; }
    .toast.error { background: #A32D2D; color: #fff; }
    select:focus, textarea:focus, input:focus { border-color: #888 !important; outline: none; }
    select, textarea, input[type=text], input[type=password] {
      width: 100%; border: 1px solid #D3D1C7; border-radius: 8px;
      padding: 9px 11px; font-size: 14px; outline: none;
      font-family: system-ui, sans-serif; background: #fff;
    }
    select { cursor: pointer; }
    textarea { resize: vertical; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // ── Firebase helpers ─────────────────────────────────────────────────────
    const fbDb   = () => window.__fbDb;
    const fbRef  = (...a) => window.__fbRef(...a);
    const fbSet  = (...a) => window.__fbSet(...a);
    const fbPush = (...a) => window.__fbPush(...a);
    const fbOn   = (...a) => window.__fbOnValue(...a);

    // ── Anonymous device ID ──────────────────────────────────────────────────
    const getUserId = () => {
      let id = localStorage.getItem("dh_uid");
      if (!id) { id = Math.random().toString(36).slice(2); localStorage.setItem("dh_uid", id); }
      return id;
    };
    const todayKey = () => new Date().toISOString().slice(0, 10);
    const gs = (k, fb) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : fb; } catch { return fb; } };
    const ss = (k, v)  => localStorage.setItem(k, JSON.stringify(v));

    // ── Constants ────────────────────────────────────────────────────────────
    const LATE_NIGHT_IDS = new Set(["elder", "plex-east"]);

    const DINING_HALLS = [
      {
        id: "elder", name: "Elder Dining Hall", color: "#8B2FC9",
        location: "North Campus",
        features: ["Kosher Station", "Street Food (United)", "Late Night"],
        hours: {
          weekday: { breakfast:"7:00–10:00 AM", lunch:"11:00 AM–2:00 PM", dinner:"5:00–8:00 PM", lateNight:"8:00–10:00 PM" },
          weekend: { brunch:"10:00 AM–2:00 PM", dinner:"5:00–8:00 PM" },
        },
      },
      {
        id: "sargent", name: "Sargent Dining Hall", color: "#0F6E56",
        location: "North Campus",
        features: ["Largest Hall", "Grill Station"],
        hours: {
          weekday: { breakfast:"7:00–10:00 AM", lunch:"11:00 AM–2:00 PM", dinner:"5:00–8:00 PM" },
          weekend: { brunch:"10:00 AM–2:00 PM", dinner:"5:00–8:00 PM" },
        },
      },
      {
        id: "plex-east", name: "Plex East", color: "#BA7517",
        location: "Mid Campus (Foster-Walker)",
        features: ["Pure Eats", "Stir Fry", "Late Night"],
        hours: {
          weekday: { breakfast:"7:00–10:00 AM", lunch:"11:00 AM–2:00 PM", dinner:"5:00–8:00 PM", lateNight:"8:00–10:00 PM" },
          weekend: { brunch:"10:00 AM–2:00 PM", dinner:"5:00–8:00 PM" },
        },
      },
      {
        id: "plex-west", name: "Plex West", color: "#185FA5",
        location: "Mid Campus (Foster-Walker)",
        features: ["100% Pure Eats", "Allergy-Free", "Made-to-Order"],
        hours: {
          weekday: { breakfast:"7:00–10:00 AM", lunch:"11:00 AM–2:00 PM", dinner:"5:00–8:00 PM" },
          weekend: { brunch:"10:00 AM–2:00 PM", dinner:"5:00–8:00 PM" },
        },
      },
      {
        id: "allison", name: "Allison Dining Hall", color: "#993556",
        location: "South Campus",
        features: ["Kosher Station", "Pure Eats", "2-Floor Seating"],
        hours: {
          weekday: { breakfast:"7:00–10:00 AM", lunch:"11:00 AM–2:00 PM", dinner:"5:00–8:00 PM" },
          weekend: { brunch:"10:00 AM–2:00 PM", dinner:"5:00–8:00 PM" },
        },
      },
    ];

    const REPORT_CATEGORIES = [
      "Juice / Beverage Dispenser Down",
      "Station Closed",
      "Food Item Out",
      "Equipment Issue",
      "Long Wait / Understaffed",
      "Other",
    ];

    const TRAFFIC_LEVELS = [
      { label: "Empty",    wait: "0 min wait",   bg: "#EBF5E0", fg: "#3B6D11" },
      { label: "Light",    wait: "~2 min wait",  bg: "#FFF8E6", fg: "#7A5400" },
      { label: "Moderate", wait: "~5 min wait",  bg: "#FEF0DC", fg: "#8C3D00" },
      { label: "Busy",     wait: "~8 min wait",  bg: "#FDECEA", fg: "#8B1A1A" },
      { label: "Packed",   wait: "10+ min wait", bg: "#F9E0E0", fg: "#6B0000" },
    ];

    // ── Hours logic ──────────────────────────────────────────────────────────
    function getOpenWindow(hallId) {
      const day = new Date().getDay();
      const isWeekend = day === 0 || day === 6;
      const isFriday  = day === 5;
      const lateNight = LATE_NIGHT_IDS.has(hallId);
      if (isWeekend)              return { opensMin:600,    closesMin:20*60, opensLabel:"10:00 AM", closesLabel:"8:00 PM"  };
      if (lateNight && !isFriday) return { opensMin:7*60,   closesMin:22*60, opensLabel:"7:00 AM",  closesLabel:"10:00 PM" };
      return                             { opensMin:7*60,   closesMin:20*60, opensLabel:"7:00 AM",  closesLabel:"8:00 PM"  };
    }

    function getNextOpenWindow(hallId) {
      const nextDay   = (new Date().getDay() + 1) % 7;
      const isWeekend = nextDay === 0 || nextDay === 6;
      const isFriday  = nextDay === 5;
      const lateNight = LATE_NIGHT_IDS.has(hallId);
      if (isWeekend)              return { opensLabel:"10:00 AM", closesLabel:"8:00 PM"  };
      if (lateNight && !isFriday) return { opensLabel:"7:00 AM",  closesLabel:"10:00 PM" };
      return                             { opensLabel:"7:00 AM",  closesLabel:"8:00 PM"  };
    }

    function getCurrentMealPeriod(hall) {
      const mins = new Date().getHours() * 60 + new Date().getMinutes();
      const { opensMin, closesMin, opensLabel, closesLabel } = getOpenWindow(hall.id);
      if (mins >= opensMin && mins < closesMin) return { open: true,  closesAt: closesLabel };
      if (mins < opensMin)                      return { open: false, opensAt: opensLabel, closesAt: closesLabel };
      const next = getNextOpenWindow(hall.id);
      return { open: false, opensAt: next.opensLabel, closesAt: next.closesLabel };
    }

    const timeAgo = (iso) => {
      const m = Math.floor((Date.now() - new Date(iso).getTime()) / 60000);
      if (m < 1) return "just now";
      if (m < 60) return `${m}m ago`;
      return `${Math.floor(m / 60)}h ago`;
    };

    // ── Shared UI components ─────────────────────────────────────────────────
    const FieldLabel = ({ children, optional }) => (
      <div className="ff-sans" style={{ fontSize:13, fontWeight:600, color:"#444441", marginBottom:6 }}>
        {children}{optional && <span style={{ fontWeight:400, color:"#888780" }}> (optional)</span>}
      </div>
    );

    const ModalActions = ({ onClose, children }) => (
      <div style={{ display:"flex", gap:10, justifyContent:"flex-end", marginTop:4 }}>
        <button className="btn btn-ghost" onClick={onClose}>Cancel</button>
        {children}
      </div>
    );

    function Modal({ title, sub, onClose, children }) {
      return (
        <div className="modal-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
          <div className="modal-box fade-in">
            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", marginBottom:18 }}>
              <div>
                <div className="ff-serif" style={{ fontSize:20, fontWeight:700, color:"#2C2C2A" }}>{title}</div>
                {sub && <div className="ff-sans" style={{ fontSize:12, color:"#888780", marginTop:2 }}>{sub}</div>}
              </div>
              <button style={{ background:"none", border:"none", fontSize:18, cursor:"pointer", color:"#888780", lineHeight:1 }} onClick={onClose}>✕</button>
            </div>
            {children}
          </div>
        </div>
      );
    }

    function ReportRow({ r, color, faded }) {
      return (
        <div style={{ borderLeft:`3px solid ${faded?"#D3D1C7":color}`, padding:"8px 12px", borderRadius:"0 8px 8px 0", background:faded?"transparent":"#F9F7F2", marginBottom:8 }}>
          <div style={{ display:"flex", justifyContent:"space-between" }}>
            <span className="ff-sans" style={{ fontSize:13, fontWeight:600, color:"#2C2C2A" }}>{r.category}</span>
            <span className="ff-sans" style={{ fontSize:12, color:"#888780" }}>{timeAgo(r.time)}</span>
          </div>
          {r.detail && <div className="ff-sans" style={{ fontSize:12, color:"#5F5E5A", marginTop:2 }}>{r.detail}</div>}
        </div>
      );
    }

    // ── Modals ───────────────────────────────────────────────────────────────
    function ReportModal({ dh, onClose, onSubmit, dailyCnt }) {
      const [cat, setCat]       = useState("");
      const [detail, setDetail] = useState("");
      const rem = 3 - dailyCnt;
      return (
        <Modal title="Report an Issue" sub={`${dh.name} · ${rem} report${rem!==1?"s":""} left today`} onClose={onClose}>
          {rem === 0 ? (
            <div style={{ textAlign:"center", padding:"20px 0" }}>
              <div className="ff-serif" style={{ fontSize:18, color:"#2C2C2A" }}>Daily limit reached</div>
              <div className="ff-sans" style={{ fontSize:14, color:"#888780", marginTop:4 }}>Come back tomorrow.</div>
              <button className="btn btn-ghost" style={{ marginTop:16 }} onClick={onClose}>Close</button>
            </div>
          ) : (
            <>
              <FieldLabel>Issue type *</FieldLabel>
              <select value={cat} onChange={e => setCat(e.target.value)} style={{ marginBottom:14 }}>
                <option value="">Select a category…</option>
                {REPORT_CATEGORIES.map(c => <option key={c}>{c}</option>)}
              </select>
              <FieldLabel optional>Details</FieldLabel>
              <textarea rows={3} style={{ marginBottom:14 }} placeholder="Add any helpful context…" value={detail} onChange={e => setDetail(e.target.value)} />
              <ModalActions onClose={onClose}>
                <button className="btn btn-primary" style={{ background:cat?dh.color:"#B4B2A9" }} disabled={!cat}
                  onClick={() => { onSubmit(dh.id, cat, detail) && onClose(); }}>
                  Submit (+10 pts)
                </button>
              </ModalActions>
            </>
          )}
        </Modal>
      );
    }

    function TrafficModal({ dh, onClose, onSubmit }) {
      const [sel, setSel] = useState(null);
      return (
        <Modal title="Update Dining Traffic" sub={dh.name} onClose={onClose}>
          <div style={{ display:"grid", gridTemplateColumns:"repeat(5,1fr)", gap:8, marginBottom:22 }}>
            {TRAFFIC_LEVELS.map((t, i) => (
              <button key={i} onClick={() => setSel(i+1)}
                style={{ border:`2px solid ${sel===i+1?dh.color:"#D3D1C7"}`, borderRadius:8, padding:"10px 6px", background:sel===i+1?t.bg:"#fff", cursor:"pointer", transition:"all .15s", textAlign:"center" }}>
                <div className="ff-sans" style={{ fontSize:12, fontWeight:700, color:sel===i+1?t.fg:"#444", marginBottom:3 }}>{t.label}</div>
                <div className="ff-sans" style={{ fontSize:10, color:sel===i+1?t.fg:"#888780" }}>{t.wait}</div>
              </button>
            ))}
          </div>
          <ModalActions onClose={onClose}>
            <button className="btn btn-primary" style={{ background:sel?dh.color:"#B4B2A9" }} disabled={!sel}
              onClick={() => { if(sel){ onSubmit(dh.id, sel); onClose(); } }}>
              Submit Rating
            </button>
          </ModalActions>
        </Modal>
      );
    }

    function FeedbackModal({ dh, onClose, onSubmit }) {
      const [item, setItem]       = useState("");
      const [rating, setRating]   = useState(0);
      const [hover, setHover]     = useState(0);
      const [comment, setComment] = useState("");
      return (
        <Modal title="Menu Feedback" sub="Private — visible only to dining staff" onClose={onClose}>
          <div style={{ background:"#F1EFE8", borderRadius:8, padding:"9px 13px", marginBottom:16 }}>
            <div className="ff-sans" style={{ fontSize:13, color:"#5F5E5A" }}>Your feedback is <strong>completely private</strong> and shared only with staff.</div>
          </div>
          <FieldLabel>Menu item *</FieldLabel>
          <input type="text" style={{ marginBottom:14 }} placeholder="e.g. Grilled salmon, Caesar salad…" value={item} onChange={e => setItem(e.target.value)} />
          <FieldLabel>Rating *</FieldLabel>
          <div style={{ display:"flex", gap:4, marginBottom:16, alignItems:"center" }}>
            {[1,2,3,4,5].map(s => (
              <button key={s} style={{ background:"none", border:"none", cursor:"pointer", fontSize:22, padding:"2px 3px", lineHeight:1 }}
                onMouseEnter={() => setHover(s)} onMouseLeave={() => setHover(0)} onClick={() => setRating(s)}>
                {s<=(hover||rating)?"⭐":"☆"}
              </button>
            ))}
            {rating>0 && <span className="ff-sans" style={{ fontSize:13, color:"#888780", marginLeft:6 }}>{["","Poor","Below avg","Okay","Good","Excellent"][rating]}</span>}
          </div>
          <FieldLabel optional>Comments</FieldLabel>
          <textarea rows={3} style={{ marginBottom:14 }} placeholder="What did you like or dislike?" value={comment} onChange={e => setComment(e.target.value)} />
          <ModalActions onClose={onClose}>
            <button className="btn btn-primary" style={{ background:item&&rating?dh.color:"#B4B2A9" }} disabled={!item||!rating}
              onClick={() => { onSubmit(dh.id, item, rating, comment); onClose(); }}>
              Submit Feedback
            </button>
          </ModalActions>
        </Modal>
      );
    }

    // ── Detail View ──────────────────────────────────────────────────────────
    function DetailView({ dh, reports, getTrafficAvg, getActiveReports, setModal }) {
      const [tab, setTab] = useState("reports");
      const status  = getCurrentMealPeriod(dh);
      const avgT    = getTrafficAvg(dh.id);
      const tLevel  = avgT ? TRAFFIC_LEVELS[avgT-1] : null;
      const entries = reports[dh.id] ? Object.values(reports[dh.id]) : [];
      const allRpts = entries.sort((a,b) => new Date(b.time)-new Date(a.time));
      const actRpts = getActiveReports(dh.id);
      const h       = dh.hours;

      return (
        <div style={{ padding:"26px 24px", maxWidth:760, margin:"0 auto" }} className="fade-in">
          <div style={{ marginBottom:22 }}>
            <div className="ff-serif" style={{ fontSize:28, fontWeight:900, color:"#2C2C2A", marginBottom:2 }}>{dh.name}</div>
            <div className="ff-sans" style={{ fontSize:13, color:"#888780", marginBottom:12 }}>{dh.location}</div>
            <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:14, flexWrap:"wrap" }}>
              <span style={{ display:"inline-flex", alignItems:"center", gap:5, background:status.open?"#EBF5E0":"#F0EEE8", color:status.open?"#3B6D11":"#888780", borderRadius:20, padding:"4px 12px", fontSize:13, fontFamily:"sans-serif", fontWeight:600 }}>
                <span style={{ width:7, height:7, borderRadius:"50%", background:status.open?"#4CAF50":"#CCC", display:"inline-block" }} />
                {status.open ? `Open · Closes ${status.closesAt}` : `Closed · Opens ${status.opensAt} – ${status.closesAt}`}
              </span>
              {dh.features.map(f => (
                <span key={f} className="ff-sans" style={{ fontSize:11, background:"#F0EEE8", color:"#5F5E5A", padding:"3px 9px", borderRadius:20, fontWeight:600 }}>{f}</span>
              ))}
            </div>
            <div style={{ background:"#F5F4EF", borderRadius:10, padding:"14px 16px", marginBottom:18 }}>
              <div className="ff-sans" style={{ fontSize:11, fontWeight:700, textTransform:"uppercase", letterSpacing:".05em", color:"#888780", marginBottom:10 }}>Hours of Operation</div>
              <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:14 }}>
                <div>
                  <div className="ff-sans" style={{ fontSize:12, fontWeight:700, color:"#444441", marginBottom:5 }}>Mon – Fri</div>
                  {Object.entries(h.weekday).map(([meal, range]) => (
                    <div key={meal} className="ff-sans" style={{ fontSize:12, color:"#5F5E5A", marginBottom:3, display:"flex", justifyContent:"space-between", gap:12 }}>
                      <span style={{ fontWeight:600 }}>{meal==="lateNight"?"Late Night":meal.charAt(0).toUpperCase()+meal.slice(1)}</span>
                      <span>{range}</span>
                    </div>
                  ))}
                </div>
                <div>
                  <div className="ff-sans" style={{ fontSize:12, fontWeight:700, color:"#444441", marginBottom:5 }}>Sat – Sun</div>
                  {Object.entries(h.weekend).map(([meal, range]) => (
                    <div key={meal} className="ff-sans" style={{ fontSize:12, color:"#5F5E5A", marginBottom:3, display:"flex", justifyContent:"space-between", gap:12 }}>
                      <span style={{ fontWeight:600 }}>{meal.charAt(0).toUpperCase()+meal.slice(1)}</span>
                      <span>{range}</span>
                    </div>
                  ))}
                </div>
              </div>
            </div>
            <div style={{ display:"flex", gap:10, flexWrap:"wrap" }}>
              <button className="btn btn-ghost" onClick={() => setModal("report")}>📢 Report an Issue</button>
              <button className="btn btn-ghost" onClick={() => setModal("traffic")}>📊 Update Traffic</button>
              <button className="btn btn-ghost" onClick={() => setModal("feedback")}>💬 Menu Feedback</button>
            </div>
          </div>

          {tLevel && (
            <div style={{ background:tLevel.bg, borderRadius:10, padding:"16px 20px", marginBottom:22, display:"flex", justifyContent:"space-between", alignItems:"center" }}>
              <div>
                <div className="ff-sans" style={{ fontSize:11, fontWeight:700, textTransform:"uppercase", letterSpacing:".05em", color:tLevel.fg, marginBottom:2 }}>Current Dining Traffic</div>
                <div className="ff-serif" style={{ fontSize:28, fontWeight:900, color:tLevel.fg }}>{tLevel.label}</div>
              </div>
              <div className="ff-sans" style={{ fontSize:20, fontWeight:700, color:tLevel.fg }}>{tLevel.wait}</div>
            </div>
          )}

          <div style={{ display:"flex", borderBottom:"1px solid #D3D1C7", marginBottom:20 }}>
            {[["reports","Issue Reports"],["history","All Reports"]].map(([t,label]) => (
              <button key={t} className={`tab-btn ${tab===t?"active":""}`}
                style={{ color:tab===t?dh.color:"#888780", borderBottomColor:tab===t?dh.color:"transparent" }}
                onClick={() => setTab(t)}>{label}</button>
            ))}
          </div>

          {tab==="reports" && (
            <div className="fade-in">
              {actRpts.length===0
                ? <div className="ff-sans" style={{ color:"#B4B2A9", fontStyle:"italic", fontSize:14 }}>No active issues in the last 4 hours.</div>
                : actRpts.map((r,i) => <ReportRow key={i} r={r} color={dh.color} />)}
            </div>
          )}
          {tab==="history" && (
            <div className="fade-in">
              {allRpts.length===0
                ? <div className="ff-sans" style={{ color:"#B4B2A9", fontStyle:"italic", fontSize:14 }}>No reports yet.</div>
                : allRpts.map((r,i) => <ReportRow key={i} r={r} color={dh.color} faded />)}
            </div>
          )}
        </div>
      );
    }

    // ── Admin Dashboard ──────────────────────────────────────────────────────
    function AdminDashboard({ feedback, allReports, getTrafficAvg }) {
      const [authed, setAuthed] = useState(false);
      const [pw, setPw]         = useState("");
      const [pwErr, setPwErr]   = useState(false);
      const [tab, setTab]       = useState("feedback");
      const [filterHall, setFilterHall]         = useState("all");
      const [filterRating, setFilterRating]     = useState("all");
      const [filterCategory, setFilterCategory] = useState("all");
      const [search, setSearch]   = useState("");
      const [sortDir, setSortDir] = useState("desc");

      const tryLogin = () => {
        if (pw === "TeamOrange") { setAuthed(true); setPwErr(false); }
        else setPwErr(true);
      };

      const filteredFeedback = useMemo(() => {
        let f = [...feedback];
        if (filterHall!=="all")   f = f.filter(x => x.dhId===filterHall);
        if (filterRating!=="all") f = f.filter(x => x.rating===parseInt(filterRating));
        if (search) f = f.filter(x => x.menuItem.toLowerCase().includes(search.toLowerCase()) || (x.comment||"").toLowerCase().includes(search.toLowerCase()));
        f.sort((a,b) => sortDir==="desc" ? new Date(b.time)-new Date(a.time) : new Date(a.time)-new Date(b.time));
        return f;
      }, [feedback, filterHall, filterRating, search, sortDir]);

      const filteredReports = useMemo(() => {
        let r = [...allReports];
        if (filterHall!=="all")     r = r.filter(x => x.dhId===filterHall);
        if (filterCategory!=="all") r = r.filter(x => x.category===filterCategory);
        if (search) r = r.filter(x => x.category.toLowerCase().includes(search.toLowerCase()) || (x.detail||"").toLowerCase().includes(search.toLowerCase()));
        r.sort((a,b) => sortDir==="desc" ? new Date(b.time)-new Date(a.time) : new Date(a.time)-new Date(b.time));
        return r;
      }, [allReports, filterHall, filterCategory, search, sortDir]);

      const feedbackByHall = useMemo(() => DINING_HALLS.map(hall => {
        const hf  = feedback.filter(f => f.dhId===hall.id);
        const avg = hf.length ? (hf.reduce((s,f)=>s+f.rating,0)/hf.length).toFixed(1) : null;
        return { ...hall, count:hf.length, avg };
      }), [feedback]);

      const reportsByCategory = useMemo(() => {
        const counts = {};
        allReports.forEach(r => { counts[r.category]=(counts[r.category]||0)+1; });
        return Object.entries(counts).sort((a,b)=>b[1]-a[1]);
      }, [allReports]);

      const topMenuItems = useMemo(() => {
        const items = {};
        feedback.forEach(f => {
          const key = f.menuItem.toLowerCase().trim();
          if (!items[key]) items[key] = { name:f.menuItem, ratings:[] };
          items[key].ratings.push(f.rating);
        });
        return Object.values(items)
          .map(i => ({ ...i, avg:i.ratings.reduce((s,r)=>s+r,0)/i.ratings.length }))
          .sort((a,b)=>b.ratings.length-a.ratings.length).slice(0,10);
      }, [feedback]);

      if (!authed) return (
        <div style={{ padding:"60px 24px", maxWidth:400, margin:"0 auto", textAlign:"center" }} className="fade-in">
          <div style={{ fontSize:48, marginBottom:16 }}>🔐</div>
          <div className="ff-serif" style={{ fontSize:28, fontWeight:900, color:"#2C2C2A", marginBottom:6 }}>Admin Access</div>
          <div className="ff-sans" style={{ fontSize:14, color:"#888780", marginBottom:32 }}>Northwestern Dining Staff Only</div>
          <div className="card" style={{ padding:28, textAlign:"left" }}>
            <label className="ff-sans" style={{ fontSize:13, fontWeight:600, color:"#444441", display:"block", marginBottom:6 }}>Password</label>
            <input type="password" placeholder="Enter admin password" value={pw}
              onChange={e => { setPw(e.target.value); setPwErr(false); }}
              onKeyDown={e => e.key==="Enter" && tryLogin()}
              style={{ borderColor:pwErr?"#A32D2D":"#D3D1C7", marginBottom:4 }} />
            {pwErr && <div className="ff-sans" style={{ fontSize:12, color:"#A32D2D", marginBottom:4 }}>Incorrect password.</div>}
            <button className="btn btn-primary" style={{ width:"100%", marginTop:16, padding:12 }} onClick={tryLogin}>Sign In</button>
          </div>
        </div>
      );

      return (
        <div style={{ padding:"28px 24px", maxWidth:920, margin:"0 auto" }} className="fade-in">
          <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", marginBottom:28, flexWrap:"wrap", gap:12 }}>
            <div>
              <div className="ff-serif" style={{ fontSize:30, fontWeight:900, color:"#2C2C2A" }}>Admin Dashboard</div>
              <div className="ff-sans" style={{ fontSize:13, color:"#888780" }}>Northwestern Dining · Staff view only</div>
            </div>
            <div style={{ display:"flex", gap:10, flexWrap:"wrap" }}>
              <span className="pill" style={{ background:"#EAF3DE", color:"#3B6D11", padding:"6px 14px", fontSize:12 }}>{feedback.length} feedback entries</span>
              <span className="pill" style={{ background:"#FAECE7", color:"#993C1D", padding:"6px 14px", fontSize:12 }}>{allReports.length} total reports</span>
            </div>
          </div>

          <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fit, minmax(140px, 1fr))", gap:12, marginBottom:28 }}>
            {feedbackByHall.map(hall => (
              <div key={hall.id} style={{ background:"#fff", border:"0.5px solid #D3D1C7", borderRadius:10, padding:"14px 16px", borderTop:`3px solid ${hall.color}` }}>
                <div className="ff-sans" style={{ fontSize:11, color:"#888780", marginBottom:4 }}>{hall.name}</div>
                <div className="ff-serif" style={{ fontSize:22, fontWeight:700, color:"#2C2C2A" }}>{hall.avg?`${hall.avg}★`:"—"}</div>

            ))}
          </div>

          <div style={{ display:"flex", borderBottom:"1px solid #D3D1C7", marginBottom:24 }}>
            {[["feedback","💬 Menu Feedback"],["reports","📢 Issue Reports"],["insights","📊 Insights"]].map(([t,label]) => (
              <button key={t} className={`tab-btn ${tab===t?"active":""}`}
                onClick={() => { setTab(t); setSearch(""); setFilterHall("all"); setFilterRating("all"); setFilterCategory("all"); }}>

            ))}
          </div>

          {tab!=="insights" && (
            <div style={{ display:"flex", gap:10, marginBottom:20, flexWrap:"wrap" }}>
              <input type="text" placeholder="Search..." value={search} onChange={e => setSearch(e.target.value)} style={{ flex:"1 1 160px" }} />
              <select value={filterHall} onChange={e => setFilterHall(e.target.value)} style={{ flex:"0 0 160px" }}>
                <option value="all">All Halls</option>
                {DINING_HALLS.map(d => <option key={d.id} value={d.id}>{d.name}</option>)}
              </select>
              {tab==="feedback" && (
                <select value={filterRating} onChange={e => setFilterRating(e.target.value)} style={{ flex:"0 0 130px" }}>
                  <option value="all">All Ratings</option>
                  {[5,4,3,2,1].map(r => <option key={r} value={r}>{"⭐".repeat(r)} {r} star</option>)}
                </select>
              )}
              {tab==="reports" && (
                <select value={filterCategory} onChange={e => setFilterCategory(e.target.value)} style={{ flex:"0 0 210px" }}>
                  <option value="all">All Categories</option>
                  {REPORT_CATEGORIES.map(c => <option key={c} value={c}>{c}</option>)}
                </select>
              )}
              <button className="btn btn-ghost" style={{ fontSize:12, padding:"8px 14px" }}
                onClick={() => setSortDir(d => d==="desc"?"asc":"desc")}>
                {sortDir==="desc"?"↓ Newest first":"↑ Oldest first"}
              </button>
            </div>
          )}

          {tab==="feedback" && (
            <div className="fade-in">
              {filteredFeedback.length===0
                ? <div className="ff-sans" style={{ color:"#B4B2A9", fontStyle:"italic", textAlign:"center", padding:"40px 0" }}>No feedback found.</div>
                : filteredFeedback.map((f,i) => {
                  const hall = DINING_HALLS.find(d => d.id===f.dhId);
                  return (
                    <div key={i} style={{ background:"#fff", border:"0.5px solid #D3D1C7", borderRadius:10, padding:"16px 18px", marginBottom:10, borderLeft:`3px solid ${hall?.color||"#888"}` }}>
                      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", marginBottom:4, flexWrap:"wrap", gap:8 }}>
                        <div style={{ display:"flex", alignItems:"center", gap:10 }}>
                          <span className="ff-serif" style={{ fontSize:16, fontWeight:700, color:"#2C2C2A" }}>{f.menuItem}</span>
                          <span style={{ fontSize:13 }}>{"⭐".repeat(f.rating)}{"☆".repeat(5-f.rating)}</span>
                        </div>
                        <div style={{ display:"flex", gap:8, alignItems:"center", flexWrap:"wrap" }}>
                          <span className="pill" style={{ background:"#F1EFE8", color:"#5F5E5A" }}>{hall?.name}</span>
                          <span className="ff-sans" style={{ fontSize:12, color:"#888780" }}>{timeAgo(f.time)}</span>
                        </div>
                      </div>
                      {f.comment && <div className="ff-sans" style={{ fontSize:13, color:"#5F5E5A", lineHeight:1.6, background:"#FAFAF7", borderRadius:6, padding:"8px 12px", marginTop:6 }}>"{f.comment}"</div>}
                      <div className="ff-sans" style={{ fontSize:11, color:"#B4B2A9", marginTop:6 }}>Anonymous · User {f.user?.slice(0,8)}</div>
                    </div>
                  );
                })
              }
            </div>
          )}

          {tab==="reports" && (
            <div className="fade-in">
              {filteredReports.length===0
                ? <div className="ff-sans" style={{ color:"#B4B2A9", fontStyle:"italic", textAlign:"center", padding:"40px 0" }}>No reports found.</div>
                : filteredReports.map((r,i) => {
                  const hall     = DINING_HALLS.find(d => d.id===r.dhId);
                  const isActive = Date.now()-new Date(r.time).getTime() < 4*3600000;
                  return (
                    <div key={i} style={{ background:"#fff", border:"0.5px solid #D3D1C7", borderRadius:10, padding:"14px 18px", marginBottom:8, borderLeft:`3px solid ${hall?.color||"#888"}` }}>
                      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", flexWrap:"wrap", gap:8 }}>
                        <div style={{ display:"flex", gap:10, alignItems:"center" }}>
                          <span className="ff-sans" style={{ fontWeight:600, fontSize:14, color:"#2C2C2A" }}>{r.category}</span>
                          {isActive && <span className="pill" style={{ background:"#FAECE7", color:"#993C1D" }}>Active</span>}
                        </div>
                        <div style={{ display:"flex", gap:8, alignItems:"center" }}>
                          <span className="pill" style={{ background:"#F1EFE8", color:"#5F5E5A" }}>{hall?.name}</span>
                          <span className="ff-sans" style={{ fontSize:12, color:"#888780" }}>{timeAgo(r.time)}</span>
                        </div>
                      </div>
                      {r.detail && <div className="ff-sans" style={{ fontSize:13, color:"#5F5E5A", marginTop:6 }}>{r.detail}</div>}
                    </div>
                  );
                })
              }
            </div>
          )}

          {tab==="insights" && (
            <div className="fade-in" style={{ display:"grid", gridTemplateColumns:"repeat(auto-fit, minmax(260px, 1fr))", gap:20 }}>
              <div className="card" style={{ padding:20 }}>
                <div className="ff-serif" style={{ fontSize:16, fontWeight:700, color:"#2C2C2A", marginBottom:14 }}>Top menu items by volume</div>
                {topMenuItems.length===0
                  ? <div className="ff-sans" style={{ fontSize:13, color:"#B4B2A9", fontStyle:"italic" }}>No feedback yet</div>
                  : topMenuItems.map((item,i) => (
                    <div key={i} style={{ display:"flex", justifyContent:"space-between", alignItems:"center", padding:"8px 0", borderBottom:"0.5px solid #E8E7E0" }}>
                      <div>
                        <div className="ff-sans" style={{ fontSize:13, fontWeight:600, color:"#2C2C2A" }}>{item.name}</div>
                        <div className="ff-sans" style={{ fontSize:11, color:"#888780" }}>{item.ratings.length} review{item.ratings.length!==1?"s":""}</div>
                      </div>
                      <span className="ff-sans" style={{ fontSize:14, fontWeight:600, color:item.avg>=4?"#3B6D11":item.avg>=3?"#BA7517":"#A32D2D" }}>{item.avg.toFixed(1)} ★</span>
                    </div>
                  ))
                }
              </div>
              <div className="card" style={{ padding:20 }}>
                <div className="ff-serif" style={{ fontSize:16, fontWeight:700, color:"#2C2C2A", marginBottom:14 }}>Most reported issues</div>
                {reportsByCategory.length===0
                  ? <div className="ff-sans" style={{ fontSize:13, color:"#B4B2A9", fontStyle:"italic" }}>No reports yet</div>
                  : reportsByCategory.map(([cat,count],i) => {
                    const maxCount = reportsByCategory[0][1];
                    return (
                      <div key={i} style={{ marginBottom:12 }}>
                        <div style={{ display:"flex", justifyContent:"space-between", marginBottom:4 }}>
                          <span className="ff-sans" style={{ fontSize:13, color:"#444441" }}>{cat}</span>
                          <span className="ff-sans" style={{ fontSize:12, fontWeight:600, color:"#2C2C2A" }}>{count}</span>
                        </div>
                        <div style={{ height:6, background:"#E8E7E0", borderRadius:3, overflow:"hidden" }}>
                          <div style={{ height:"100%", width:`${(count/maxCount)*100}%`, background:"#D85A30", borderRadius:3 }} />
                        </div>
                      </div>
                    );
                  })
                }
              </div>
              <div className="card" style={{ padding:20 }}>
                <div className="ff-serif" style={{ fontSize:16, fontWeight:700, color:"#2C2C2A", marginBottom:14 }}>Current dining traffic</div>
                {DINING_HALLS.map(hall => {
                  const avg = getTrafficAvg(hall.id);
                  const tl  = avg ? TRAFFIC_LEVELS[avg-1] : null;
                  return (
                    <div key={hall.id} style={{ marginBottom:14 }}>
                      <div style={{ display:"flex", justifyContent:"space-between", marginBottom:4 }}>
                        <span className="ff-sans" style={{ fontSize:13, color:"#444441" }}>{hall.name}</span>
                        <span className="ff-sans" style={{ fontSize:12, fontWeight:600, color:tl?hall.color:"#B4B2A9" }}>{tl?tl.label:"No data"}</span>
                      </div>
                      <div style={{ height:6, background:"#E8E7E0", borderRadius:3, overflow:"hidden" }}>
                        <div style={{ height:"100%", width:tl?`${(avg/5)*100}%`:"0%", background:hall.color, borderRadius:3 }} />
                      </div>
                    </div>
                  );
                })}
              </div>
              <div className="card" style={{ padding:20 }}>
                <div className="ff-serif" style={{ fontSize:16, fontWeight:700, color:"#2C2C2A", marginBottom:14 }}>Avg menu rating by hall</div>
                {feedbackByHall.map(hall => (
                  <div key={hall.id} style={{ display:"flex", justifyContent:"space-between", alignItems:"center", padding:"8px 0", borderBottom:"0.5px solid #E8E7E0" }}>
                    <span className="ff-sans" style={{ fontSize:13, color:"#444441" }}>{hall.name}</span>
                    <span className="ff-sans" style={{ fontSize:14, fontWeight:600, color:hall.avg>=4?"#3B6D11":hall.avg>=3?"#BA7517":hall.avg?"#A32D2D":"#B4B2A9" }}>
                      {hall.avg?`${hall.avg} ★`:"No data"}
                    </span>
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>
      );
    }

    // ── Main App ─────────────────────────────────────────────────────────────
    function App() {
      const uid = getUserId();
      const [view,     setView]     = useState("home");
      const [activeDH, setActiveDH] = useState(null);
      const [modal,    setModal]    = useState(null);

      const [reports,  setReports]  = useState({});
      const [traffic,  setTraffic]  = useState({});
      const [feedback, setFeedback] = useState([]);
      const [points,   setPoints]   = useState(() => gs("dh_pts_"+uid, 0));
      const [dailyCnt, setDailyCnt] = useState(() => gs("dh_day_"+uid+"_"+todayKey(), 0));
      const [toast,    setToast]    = useState(null);

      useEffect(() => ss("dh_pts_"+uid, points),                      [points, uid]);
      useEffect(() => ss("dh_day_"+uid+"_"+todayKey(), dailyCnt),     [dailyCnt, uid]);

      // Subscribe to Firebase
      useEffect(() => {
        const db = fbDb();
        if (!db) return;
        const u1 = fbOn(fbRef(db, "reports"),  snap => setReports(snap.val()  || {}));
        const u2 = fbOn(fbRef(db, "traffic"),  snap => setTraffic(snap.val()  || {}));
        const u3 = fbOn(fbRef(db, "feedback"), snap => {
          const val = snap.val();
          if (!val) { setFeedback([]); return; }
          const items = Object.values(val).filter(f => f && f.menuItem && f.dhId);
          items.sort((a, b) => new Date(b.time) - new Date(a.time));
          setFeedback(items);
        });
        return () => { u1(); u2(); u3(); };
      }, []);

      const showToast = (msg, type="success") => {
        setToast({ msg, type });
        setTimeout(() => setToast(null), 3200);
      };

      const submitReport = (dhId, cat, detail) => {
        if (dailyCnt >= 3) { showToast("Daily report limit reached (3/day)", "error"); return false; }
        fbPush(fbRef(fbDb(), `reports/${dhId}`), { dhId, category:cat, detail, time:new Date().toISOString(), user:uid });
        setPoints(p => p+10);
        setDailyCnt(c => c+1);
        showToast(`+10 pts! Report submitted. ${2-dailyCnt} left today.`);
        return true;
      };

      const submitTraffic = (dhId, rating) => {
        fbSet(fbRef(fbDb(), `traffic/${dhId}/${uid}`), { rating, time:Date.now() });
        showToast("Dining traffic updated!");
      };

      const submitFeedback = (dhId, item, rating, comment) => {
        if (dailyCnt >= 3) { showToast("Daily report limit reached (3/day)", "error"); return; }
        if (!fbDb()) { showToast("Database not connected", "error"); return; }
        fbPush(fbRef(fbDb(), "feedback"), {
          dhId:     dhId,
          menuItem: item,
          rating:   rating,
          comment:  comment || "",
          time:     new Date().toISOString(),
          user:     uid
        });
        setPoints(p => p + 10);
        setDailyCnt(c => c + 1);
        showToast(`Thanks for your feedback! +10 pts · ${2 - dailyCnt} left today`);
      };

      const getTrafficAvg = (dhId) => {
        const entries = traffic[dhId] ? Object.values(traffic[dhId]) : [];
        const recent  = entries.filter(e => Date.now()-e.time < 1800000);
        if (!recent.length) return null;
        return Math.round(recent.reduce((s,e)=>s+e.rating,0)/recent.length);
      };

      const getActiveReports = (dhId) => {
        const entries = reports[dhId] ? Object.values(reports[dhId]) : [];
        return entries.filter(r => Date.now()-new Date(r.time).getTime() < 4*3600000);
      };

      const sortedHalls = useMemo(() =>
        [...DINING_HALLS].sort((a,b) => {
          const aS=getCurrentMealPeriod(a), bS=getCurrentMealPeriod(b);
          if (aS.open&&!bS.open) return -1;
          if (!aS.open&&bS.open) return 1;
          if (aS.open&&bS.open) return (getTrafficAvg(a.id)??0)-(getTrafficAvg(b.id)??0);
          return 0;
        }),
      [traffic]);

      const dh = activeDH ? DINING_HALLS.find(d => d.id===activeDH) : null;

      const allReportsFlat = useMemo(() =>
        DINING_HALLS.flatMap(hall => {
          const entries = reports[hall.id] ? Object.values(reports[hall.id]) : [];
          return entries.map(r => ({ ...r, hallName:hall.name, hallColor:hall.color }));
        }).sort((a,b) => new Date(b.time)-new Date(a.time)),
      [reports]);

      return (
        <div style={{ minHeight:"100vh", background:"#FAFAF7" }}>
          <header style={{ background:"#2C2C2A", color:"#FAFAF7", padding:"14px 24px", display:"flex", alignItems:"center", justifyContent:"space-between" }}>
            <div style={{ display:"flex", alignItems:"center", gap:12 }}>
              {view!=="home" && <button className="btn-ghost-inv" onClick={() => { setView("home"); setActiveDH(null); }}>← Back</button>}
              <div>
                <div className="ff-serif" style={{ fontSize:19, fontWeight:700 }}>Wildcat Eats</div>
                <div className="ff-sans" style={{ fontSize:10, color:"#B4B2A9", letterSpacing:".06em", textTransform:"uppercase" }}>Northwestern Dining</div>
              </div>
            </div>
            <div style={{ display:"flex", alignItems:"center", gap:10 }}>
              <button className="btn" style={{ background:"transparent", border:"1px solid #5F5E5A", color:"#B4B2A9", fontSize:12, padding:"6px 14px" }}
                onClick={() => { setView("admin"); setActiveDH(null); }}>🔐 Admin</button>
              <div className="ff-sans pts-badge">
                <span>⭐ {points} pts</span>
                <span style={{ color:"#888780", marginLeft:8, fontSize:11 }}>{3-dailyCnt} reports left</span>
              </div>
            </div>
          </header>

          {view==="home" && (
            <div style={{ padding:"28px 24px", maxWidth:820, margin:"0 auto" }} className="fade-in">
              <div className="ff-serif" style={{ fontSize:32, fontWeight:900, color:"#2C2C2A", marginBottom:2 }}>Dining Status</div>
              <div className="ff-sans" style={{ fontSize:14, color:"#888780", marginBottom:8 }}>Sorted by shortest wait · Updated by students</div>
              <div className="ff-sans" style={{ fontSize:11, color:"#B4B2A9", marginBottom:24 }}>
                Hours sourced from <a href="https://dineoncampus.com/northwestern/hours-of-operation" target="_blank" rel="noreferrer" style={{ color:"#B4B2A9" }}>dineoncampus.com/northwestern</a> — verify for holidays &amp; quarter breaks
              </div>
              <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fill, minmax(240px, 1fr))", gap:14 }}>
                {sortedHalls.map((hall,idx) => {
                  const status  = getCurrentMealPeriod(hall);
                  const avgT    = getTrafficAvg(hall.id);
                  const tLevel  = avgT ? TRAFFIC_LEVELS[avgT-1] : null;
                  const actRpts = getActiveReports(hall.id);
                  const isFirst = idx===0 && status.open;
                  return (
                    <div key={hall.id} className="card hall-card"
                      style={{ padding:"18px 20px", cursor:"pointer", borderTop:`3px solid ${hall.color}`, position:"relative" }}
                      onClick={() => { setActiveDH(hall.id); setView("detail"); }}>
                      {isFirst && (
                        <div style={{ position:"absolute", top:-1, right:12, background:hall.color, color:"#fff", fontSize:10, fontWeight:700, fontFamily:"sans-serif", padding:"2px 8px", borderRadius:"0 0 6px 6px", letterSpacing:".04em", textTransform:"uppercase" }}>
                          Shortest Wait
                        </div>
                      )}
                      <div style={{ marginBottom:10 }}>
                        <div className="ff-serif" style={{ fontSize:16, fontWeight:700, color:"#2C2C2A", marginBottom:2 }}>{hall.name}</div>
                        <div className="ff-sans" style={{ fontSize:11, color:"#888780" }}>{hall.location}</div>
                      </div>
                      <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:10 }}>
                        <span style={{ display:"inline-flex", alignItems:"center", gap:5, background:status.open?"#EBF5E0":"#F0EEE8", color:status.open?"#3B6D11":"#888780", borderRadius:20, padding:"3px 10px", fontSize:12, fontFamily:"sans-serif", fontWeight:600 }}>
                          <span style={{ width:6, height:6, borderRadius:"50%", background:status.open?"#4CAF50":"#CCC", display:"inline-block" }} />
                          {status.open ? `Open · Closes ${status.closesAt}` : `Closed · Opens ${status.opensAt} – ${status.closesAt}`}
                        </span>
                      </div>
                      {tLevel&&status.open ? (
                        <div style={{ background:tLevel.bg, borderRadius:8, padding:"7px 11px", marginBottom:10 }}>
                          <div style={{ display:"flex", justifyContent:"space-between" }}>
                            <span className="ff-sans" style={{ fontSize:12, fontWeight:700, color:tLevel.fg }}>{tLevel.label}</span>
                            <span className="ff-sans" style={{ fontSize:12, color:tLevel.fg }}>{tLevel.wait}</span>
                          </div>
                        </div>
                      ) : status.open && (
                        <div className="ff-sans" style={{ fontSize:12, color:"#B4B2A9", fontStyle:"italic", marginBottom:10 }}>No traffic data yet</div>
                      )}
                      {actRpts.length>0 && (
                        <div className="ff-sans" style={{ fontSize:12, color:"#993C1D", background:"#FAECE7", borderRadius:6, padding:"5px 10px" }}>
                          {actRpts.length} active issue{actRpts.length!==1?"s":""} · {actRpts[0].category}
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
              <div style={{ marginTop:40, padding:"24px", background:"#2C2C2A", borderRadius:16, color:"#FAFAF7" }}>
                <div className="ff-serif" style={{ fontSize:22, fontWeight:700, marginBottom:6 }}>Earn points by reporting</div>
                <div className="ff-sans" style={{ fontSize:14, color:"#B4B2A9", lineHeight:1.6 }}>
                  Each issue report earns <strong style={{ color:"#FAC775" }}>+10 points</strong>. You can submit up to <strong style={{ color:"#FAC775" }}>3 reports per day</strong>. Open a dining hall to get started.
                </div>
              </div>
            </div>
          )}

          {view==="detail" && dh && (
            <DetailView dh={dh} reports={reports} getTrafficAvg={getTrafficAvg}
              getActiveReports={getActiveReports} setModal={setModal} />
          )}

          {view==="admin" && (
            <AdminDashboard feedback={feedback} allReports={allReportsFlat} getTrafficAvg={getTrafficAvg} />
          )}

          {modal==="report"   && dh && <ReportModal   dh={dh} onClose={() => setModal(null)} onSubmit={submitReport}  dailyCnt={dailyCnt} />}
          {modal==="traffic"  && dh && <TrafficModal  dh={dh} onClose={() => setModal(null)} onSubmit={submitTraffic} />}
          {modal==="feedback" && dh && <FeedbackModal dh={dh} onClose={() => setModal(null)} onSubmit={submitFeedback} />}

          {toast && <div className={`toast ${toast.type}`}>{toast.msg}</div>}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
